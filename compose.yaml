services:
  web:
    build: .
    env_file:
      - .env
    environment:
      DJANGO_DB_PATH: /app/data/db.sqlite3
      HF_HOME: /root/.cache/huggingface
      HF_HUB_OFFLINE: "1"
    command: sh -c "python manage.py migrate --noinput && exec python manage.py runserver 0.0.0.0:8000"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      # Hot-reload Django code while editing files on Windows.
      - .:/app
      # Keep Docker data independent of the Windows SQLite database.
      - sqlite_data:/app/data
      - media_data:/app/media
      - hf_models:/root/.cache/huggingface

volumes:
  sqlite_data:
  media_data:
  hf_models:
