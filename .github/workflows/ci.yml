name: Django CI and dependency audit

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: django-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  django-tests:
    name: Django tests (Python 3.11, SQLite, local Chroma)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Disposable key for the isolated CI runner only; never use for deployment.
      DJANGO_SECRET_KEY: ci-test-only-secret-key-do-not-use-for-real-deployments-2026
      DJANGO_DEBUG: 'False'
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      HF_HUB_OFFLINE: '0'
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
      OPENROUTER_API_KEY: ''
      DJANGO_DB_PATH: ${{ github.workspace }}/documentqa-ci.sqlite3
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Cache public E5 model weights for tests that need the real model
        uses: actions/cache@v4
        with:
          path: .cache/huggingface
          key: hf-e5-small-${{ runner.os }}-v1

      - name: Install CPU-only PyTorch and project requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt

      - name: Compile Python and check tracked sensitive files
        run: |
          python -m compileall -q config documents scripts
          python scripts/security_preflight.py --strict

      - name: Validate Django configuration and migrations
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run

      - name: Test metrics/security helper scripts (offline)
        run: python -m unittest discover -s scripts/tests -v

      - name: Run complete Django test suite
        run: python manage.py test -v 1

  dependency-audit:
    name: Audit declared Python dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Check known vulnerabilities in requirements.txt
        run: |
          python -m pip install pip-audit
          pip-audit -r requirements.txt
